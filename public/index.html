<title>Endless Backrooms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Layout: one full-bleed canvas with a camcorder-style HUD on top. Deliberately single-look (dark), it is a game screen. */
:root {
  --ink: #f3ecc8;        /* HUD text, warm off-white like old tape overlays */
  --shade: #0d0b05;      /* letterbox / overlay base */
  --paper: #c9b65a;
  --debug: #52ff5e;      /* debug overlay green */      /* backrooms yellow, for the start screen accent */
  --hud: "VT323", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--shade); color: var(--ink); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font-family: var(--hud); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; font-size: clamp(18px, 3.2vw, 28px); letter-spacing: 0.04em; text-shadow: 0 0 6px rgba(0,0,0,.45);
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-rows: auto 1fr auto; }
.hud .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
/* camcorder text: soft, with the red/blue fringe VHS gives overlays */
.hud { text-shadow: 1.5px 0 rgba(255,60,60,.55), -1.5px 0 rgba(60,140,255,.5), 0 0 4px rgba(0,0,0,.5); filter: blur(.35px); }
.hud .row { align-items: end; }
.play { display: inline-flex; align-items: center; gap: .3em; }
.play b { width: 0; height: 0; border-style: solid; border-width: .32em 0 .32em .55em; border-color: transparent transparent transparent currentColor; }
.stamp { font-size: 2.3em; line-height: 1; white-space: nowrap; }
.play { font-size: 2em; }
.stamp .debug { color: var(--debug); font-size: 0.5em; }
.tools { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; justify-content: flex-end; }
.hud .hint { opacity: .8; transition: opacity 1.2s; font-size: .8em; }
.hud .hint.gone { opacity: 0; }
#fade { position: fixed; inset: 0; z-index: 4; background: var(--shade); opacity: 0; pointer-events: none; transition: opacity .5s; }
#fade.on { opacity: 1; }
#start { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; background: color-mix(in srgb, var(--shade) 55%, transparent);
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
#start .card { display: grid; gap: 14px; width: min(100%, 15em); font-size: clamp(28px, 6vw, 64px); } /* sized in em of the title, so the title can't overflow it and push off-centre */
#start h1 { margin: 0; font-weight: 400; font-size: 1.5em; line-height: .9; color: var(--paper); letter-spacing: .06em; text-wrap: balance; }
#start p { margin: 0; font-size: 22px; line-height: 1.15; }
#start .modes { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
#dbghold { position: absolute; left: 50%; bottom: 0; width: 30vw; height: 14vh; transform: translateX(-50%); -webkit-touch-callout: none; user-select: none; touch-action: none; } /* invisible: hold 3 s to flip debug mode */
#start button { font: inherit; font-size: 28px; color: var(--shade); background: var(--paper); border: 0; padding: 10px 22px; justify-self: center; cursor: pointer; letter-spacing: .08em; }
#start button:focus-visible, #mute:focus-visible, #look:focus-visible, #nv:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
#look { margin-right: 8px; }
#act { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); z-index: 5; font: inherit; font-size: clamp(20px, 4vw, 30px); color: var(--ink); background: color-mix(in srgb, var(--shade) 45%, transparent); border: 1px solid var(--ink); padding: 6px 18px; cursor: pointer; letter-spacing: .08em; }
#lookname { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: clamp(32px, 9vw, 72px); color: var(--ink); letter-spacing: .08em; text-shadow: 3px 0 rgba(255, 40, 40, .55), -3px 0 rgba(40, 200, 255, .5); z-index: 5; }
#mute, #look, #nv { pointer-events: auto; font-family: inherit; font-size: .8em; color: var(--ink); background: none; border: 1px solid color-mix(in srgb, var(--ink) 50%, transparent); padding: 2px 10px; cursor: pointer; }
/* NIGHT: a big square button mid-right, easy to hit with the right thumb */
#nv { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); width: clamp(64px, 13vmin, 110px); aspect-ratio: 1; padding: 0; font-size: clamp(16px, 3vmin, 24px); background: color-mix(in srgb, var(--shade) 35%, transparent); }
#nv.on { color: var(--shade); background: var(--ink); }
/* RUN (phones): tap to toggle running; bigger than NIGHT, bottom-right above the LOOK/SOUND row */
#runb { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); width: clamp(84px, 19vmin, 150px); aspect-ratio: 1; padding: 0;
  font: inherit; font-size: clamp(18px, 3.6vmin, 30px); color: var(--ink); background: color-mix(in srgb, var(--shade) 35%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 50%, transparent); cursor: pointer; touch-action: none; }
#runb.on { color: var(--shade); background: var(--ink); }
@media (prefers-reduced-motion: reduce) { #fade { transition: none; } }
</style>

<canvas id="c"></canvas>
<div class="hud">
  <div class="row"><span class="play">PLAY <b></b></span><span><span id="keyhud" hidden>KEY &nbsp;</span><span id="run">TAPE 1</span></span></div>
  <div></div>
  <div class="row">
    <span class="stamp"><span class="debug" id="debug">(DEBUG MODE)</span><br id="debugbr"><span id="clock">PM 5:00:00</span><br><span id="date">OCT. 28 1996</span></span>
    <span class="tools"><span class="hint" id="hint"></span><button id="look" type="button">LOOK</button><button id="mute" type="button">SOUND ON</button></span>
  </div>
</div>
<div id="fade"></div>
<button id="nv" type="button" aria-pressed="false" hidden>NIGHT</button>
<button id="runb" type="button" hidden>RUN</button>
<div id="lookname" hidden></div>
<button id="act" type="button" hidden>SEARCH</button>
<div id="start">
  <div class="card">
    <h1>ENDLESS BACKROOMS</h1>
    <div class="modes"><button id="go" type="button">NORMAL</button><button id="easy" type="button">EASY</button></div>
    <p id="how" style="font-size:18px;opacity:.75"></p>
  </div>
  <div id="dbghold" aria-hidden="true"></div>
</div>

<script id="fs1" type="x-shader">#version 300 es
precision highp float;
uniform float _CellSize, _WallHeight, _FogDensity, _T, _Seed, _NV;
uniform vec4 _FogColor, _ExitPos, _EntPos; uniform vec3 _Cam; uniform vec2 _Screen;
uniform sampler2D _WallTex, _CarpetTex;
in vec3 wp; in vec3 wn; in float wm; out vec4 o;
#define _WorldSpaceCameraPos _Cam
            // Sine-free hash: sin() hashes band badly on mobile GPUs.
            float hash(vec2 p)
            {
                vec3 p3 = fract(vec3(p.xyx) * 0.1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }

            float vnoise(vec2 p)
            {
                vec2 i = floor(p), f = fract(p);
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
            }

            // Soft shadow from a closed side of the cell, d = distance to it.
            float sideAO(float closed, float d, vec2 inward, vec2 n)
            {
                float own = step(0.5, dot(n, inward)); // a wall doesn't shadow itself
                return 1.0 - closed * (1.0 - own) * (1.0 - smoothstep(0.0, 0.7, d)) * 0.35;
            }

            // Distance to a line segment (for the EXIT letters).
            float seg(vec2 p, vec2 a, vec2 b)
            {
                vec2 pa = p - a, ba = b - a;
                return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0., 1.));
            }

            // EXIT in 14.0 cm letters, q in metres from the middle of the sign.
            float exitText(vec2 q)
            {
                vec2 p = q / 0.07 + vec2(3.35, 1.0); // letters 1.0 x 2.0 units
                float k = seg(p, vec2(0.0, 0.0), vec2(0.0, 2.0));                                      // E
                k = min(k, seg(p, vec2(0.0, 2.0), vec2(1.0, 2.0)));
                k = min(k, seg(p, vec2(0.0, 1.0), vec2(0.8, 1.0)));
                k = min(k, seg(p, vec2(0.0, 0.0), vec2(1.0, 0.0)));
                k = min(k, seg(p, vec2(1.9, 0.0), vec2(2.9, 2.0)));                                // X
                k = min(k, seg(p, vec2(1.9, 2.0), vec2(2.9, 0.0)));
                k = min(k, seg(p, vec2(4.3, 0.0), vec2(4.3, 2.0)));                                // I
                k = min(k, seg(p, vec2(5.7, 2.0), vec2(6.7, 2.0)));                                // T
                k = min(k, seg(p, vec2(6.2, 0.0), vec2(6.2, 2.0)));
                return 1.0 - smoothstep(0.12, 0.2, k);
            }

            // Light state of a room: x = panel brightness (flicker, dead, low power, dark room), y = ambient, z = power (0.0 = bad zone).
            vec3 roomLight(vec2 cell, float t)
            {
                float h = hash(cell * 7.13 + 1.7);
                float power = smoothstep(0.2, 0.32, vnoise(cell * 0.35 + _Seed)); // low-power zones: ~1.0 room in 8.0
                // Steady almost everywhere (~3.0% dead, ~1.0% flickering); about half flicker inside bad-power zones.
                float on = 0.97 + 0.03 * sin(t * 100.0 + h * 50.0);
                if (h < 0.03) on = 0.35;
                else if (h < mix(0.5, 0.01, power)) on = hash(vec2(floor(t * 14.0 + h * 97.0), h)) > 0.35 ? 1.0 : 0.45;
                on *= mix(0.3, 1.0, power);
                // Dark rooms: ~1.0 room in 20.0, in small clusters, with the power nearly gone (10.0% brightness).
                float dark = mix(0.1, 1.0, smoothstep(0.14, 0.16, vnoise(cell * 0.5 + _Seed * 1.7 + 50.0)));
                // Blackouts: big patches (~1.0 room in 12.0) where the power is all but gone: 2.0% light, most panels dead, a few faint.
                float black = smoothstep(0.17, 0.2, vnoise(cell * 0.3 + _Seed * 2.3 + 90.0));
                float faint = hash(cell * 3.1 + 4.4) < 0.2 ? 0.12 : 0.0;
                return vec3(mix(faint, on * dark, black), mix(0.8, 1.0, on) * mix(0.35, 1.0, power) * dark * mix(0.02, 1.0, black), power);
            }

            // Ceiling panels of one room: one slot per 3.0 x 3.0 tiles (9.0 per room), but each slot rolls its own fitting so the
            // grid doesn't repeat: ~20.0% empty, ~40.0% long 1x2 troffers (all running one way within a room),
            // the rest square, some nudged a tile over. w fades a neighbouring room's light in; on is that room's light state.
            void panels(vec2 cell, vec3 p, vec3 n, float w, float on, inout float direct, inout float pool, inout float glow)
            {
                float s = _CellSize, H = _WallHeight, tile = s / 9.0;
                for (float bx = 0.0; bx < 3.0; bx++)
                    for (float bz = 0.0; bz < 3.0; bz++)
                    {
                        vec2 slot = cell * 3.0 + vec2(bx, bz);
                        float r = hash(slot * 1.31 + 7.7);
                        if (r < 0.2) continue;
                        vec2 nd = (floor(vec2(hash(slot + 11.3), hash(slot + 17.9)) * 3.0) - 1.0) * step(hash(slot * 2.17 + 3.1), 0.3);
                        vec2 hs = vec2(0.42, 0.42); // half size in tiles
                        if (r < 0.6)
                        {
                            vec2 ax = hash(cell + 5.5) < 0.5 ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                            nd = nd * (1.0 - ax) + ax * (hash(slot + 23.1) < 0.5 ? 0.5 : -0.5); // spans the middle tile and a neighbour
                            hs += ax * 0.5;
                        }
                        vec2 c = cell * s + (vec2(bx, bz) + 0.5) * 3.0 * tile + nd * tile;
                        float area = hs.x * hs.y / 0.1764; // a 1x2 throws twice the light
                        vec3 L = vec3(c.x, H - 0.02, c.y) - p;
                        float d = length(L);
                        direct += w * on * area * (clamp(dot(n, L / d), 0., 1.) * 0.6 + 0.4) / (1.0 + 0.5 * d * d);
                        vec2 dl = p.xz - c;
                        pool += w * area * exp(-dot(dl, dl) * 0.5);
                        glow = min(glow, max(max(abs(dl.x) - hs.x * tile, abs(dl.y) - hs.y * tile), 0.0));
                    }
            }

            // Rare wet carpet (~1.0% of the floor): irregular soaked patches, on rotated noise so they never line up with the room grid.
            // The game code mirrors this (wetAt) so footsteps squelch on them.
            float wetness(vec2 xz)
            {
                vec2 r = vec2(xz.x * 0.8 + xz.y * 0.6, xz.y * 0.8 - xz.x * 0.6);
                return smoothstep(0.92, 0.96, vnoise(r * 0.09 + _Seed * 1.3 + 70.0) + vnoise(r * 0.9 + 3.3) * 0.12 - 0.06);
            }

            vec3 shade(vec3 p, vec3 n, float mask, float t)
            {
                float s = _CellSize, H = _WallHeight, tile = s / 9.0; // 6.0 m cell -> 0.67 m ceiling tiles

                // Which cell this pixel belongs to. Nudge along the normal so a wall picks the cell it faces.
                vec2 cell = floor((p.xz + n.xz * 0.05) / s);
                vec2 local = p.xz - cell * s; // 0..s inside the cell
                // Wrong-way rooms: a copy of the room next door borrows that room's cell, so its lights, stains and tiles repeat.
                vec3 wpos = p; // the real position, for fog and the lights you carry
                float twin = floor(round(mask) / 1024.0);
                mask -= twin * 1024.0;
                vec2 shift = twin < 0.5 ? vec2(0.0, 0.0) : twin < 1.5 ? vec2(0.0, 1.0) : twin < 2.5 ? vec2(1.0, 0.0) : twin < 3.5 ? vec2(0.0, -1.0) : vec2(-1.0, 0.0);
                cell += shift; p.xz += shift * s;
                // Soft shadows where walls meet. Mask bits: 1.0 N(+z), 2.0 E(+x), 4.0 S, 8.0 W; set = open.
                float m = mod(round(mask), 16.0); // low 4.0 bits: open sides; the rest: room variant
                float openN = mod(m, 2.0), openE = mod(floor(m / 2.0), 2.0), openS = mod(floor(m / 4.0), 2.0), openW = floor(m / 8.0);
                float ao = sideAO(1.0 - openN, s - local.y, vec2(0.0, -1.0), n.xz)
                         * sideAO(1.0 - openS, local.y, vec2(0.0, 1.0), n.xz)
                         * sideAO(1.0 - openE, s - local.x, vec2(-1.0, 0.0), n.xz)
                         * sideAO(1.0 - openW, local.x, vec2(1.0, 0.0), n.xz);

                // Light blends across open sides so rooms don't meet in a hard line: near an open edge the room
                // next door adds its panels and its light state, fading from half-and-half at the edge to nothing
                // at this room's middle. Closed sides never blend, so light still doesn't leak through walls.
                vec2 toX = vec2(local.x < s * 0.5 ? -1.0 : 1.0, 0.0), toZ = vec2(0.0, local.y < s * 0.5 ? -1.0 : 1.0);
                float fz = (toZ.y < 0.0 ? openS : openN) * (abs(local.y - s * 0.5) / (s * 0.5));
                float fx = (toX.x < 0.0 ? openW : openE) * (abs(local.x - s * 0.5) / (s * 0.5)); // 1.0 at the edge, 0.0 mid-room
                vec3 lit = roomLight(cell, t), litX = roomLight(cell + toX, t), litZ = roomLight(cell + toZ, t);
                float wx = fx * 0.5, wz = fz * 0.5; // the shared state is half-and-half right at the edge
                float on = lit.x; // this room's panels, for the glow of its own fittings
                float amb = lit.y * (1.0 - wx - wz) + litX.y * wx + litZ.y * wz;
                float power = lit.z * (1.0 - wx - wz) + litX.z * wx + litZ.z * wz;

                float direct = 0.0, pool = 0.0, glow = 1e3; // glow = distance to the nearest panel's edge
                panels(cell, p, n, 1.0, lit.x, direct, pool, glow);
                if (fx > 0.0) panels(cell + toX, p, n, fx, litX.x, direct, pool, glow);
                if (fz > 0.0) panels(cell + toZ, p, n, fz, litZ.x, direct, pool, glow);
                direct *= 0.37;

                vec3 albedo;
                float emissive = 0.0;
                float raw = round(mask), letters = 0.0;
                if (raw >= 512.0)
                {
                    // Exit sign plate (Props.ExitDoor): the door sits mid-wall, so lay the letters out from the cell centre.
                    letters = exitText(vec2(dot(p.xz - (cell + 0.5) * s, vec2(-n.z, n.x)), p.y - 2.45));
                    albedo = vec3(0.05, 0.05, 0.05);
                    ao = 1.0;
                }
                else if (raw >= 256.0)
                {
                    // Props (Props.cs): flat paint colours, lit like the room around them.
                    float pm = raw - 256.0;
                    albedo = pm < 0.5 ? vec3(0.45, 0.28, 0.14)  // wood
                           : pm < 1.5 ? vec3(0.55, 0.56, 0.55)  // metal
                           : pm < 2.5 ? vec3(0.75, 0.08, 0.06)  // stop-sign red
                           : pm < 3.5 ? vec3(0.90, 0.90, 0.88)  // white
                           : pm < 4.5 ? vec3(0.12, 0.12, 0.12)  // dark trim
                           : pm < 5.5 ? vec3(0.36, 0.33, 0.20)  // worn olive sofa fabric
                           : pm < 6.5 ? vec3(0.62, 0.42, 0.40)  // faded rose armchair fabric
                           : vec3(0.004, 0.004, 0.004);         // the entity's black wire
                    ao = 1.0;
                }
                else if (n.y > 0.5)
                {
                    // Moist tan carpet: the old carpet texture pulled toward tan, plus faint stains.
                    vec3 carpet = texture(_CarpetTex, p.xz / 2.0).rgb;
                    float stain = smoothstep(0.6, 0.85, vnoise(p.xz * 0.5 + 13.0));
                    float weave = (carpet.r + carpet.g + carpet.b) / 3.0 / 0.39; // ~1.0 on average; keep its detail but use our tan
                    albedo = vec3(0.70, 0.63, 0.36) * pow(weave, 1.5) * (1.0 - 0.18 * stain);
                    // Light pools on the carpet under each panel.
                    albedo *= 0.8 + 0.3 * min(pool, 2.0);
                    // Damp: dark water stains creeping out from the walls.
                    float dWall = min(min(mix(s - local.y, 1e3, openN), mix(local.y, 1e3, openS)),
                                      min(mix(s - local.x, 1e3, openE), mix(local.x, 1e3, openW)));
                    float damp = (1.0 - smoothstep(0.1, 0.9, dWall)) * smoothstep(0.35, 0.7, vnoise(p.xz * 1.3 + 5.0));
                    albedo *= 1.0 - damp * vec3(0.35, 0.38, 0.5);
                    float wet = wetness(p.xz);
                    albedo *= 1.0 - wet * vec3(0.55, 0.5, 0.35);
                    emissive += wet * 0.12 * min(pool, 2.0); // a dull sheen under the lights
                }
                else if (n.y < -0.5 && p.y > H - 0.05) // archway beam undersides fall through to paint
                {
                    // Drop ceiling: cream tiles, thin grid lines, glowing panel with a soft halo.
                    vec2 g = abs(fract(local / tile) - 0.5);
                    float grid = 1.0 - smoothstep(0.46, 0.495, max(g.x, g.y)) * 0.35;
                    albedo = vec3(0.58, 0.56, 0.36) * grid; // dimmer olive, so the panels pop like in the footage
                    // Some tiles are water-stained; a rare few are missing and show the dark void above.
                    vec2 tid = floor(p.xz / tile);
                    float th = hash(tid + 3.7);
                    if (th > 0.92) albedo *= mix(vec3(1.0, 1.0, 1.0), vec3(0.7, 0.6, 0.4), smoothstep(0.3, 0.7, vnoise(p.xz * 3.0 + th * 9.0)));
                    float missing = th > 0.995 && glow > 0.0 ? 1.0 : 0.0; // ~1.0 in 200.0 tiles, never a light
                    emissive = (glow <= 0.0 ? 3.0 : 0.0) + 0.35 * exp(-glow * 3.0);
                    if (missing > 0.0) { albedo *= 0.04; emissive = 0.0; }
                }
                else
                {
                    // Mono-yellow chevron wallpaper (the old texture), lightly mottled; darker baseboard.
                    float u = dot(p.xz, vec2(-n.z, n.x));
                    float mottle = vnoise(vec2(u, p.y) * 7.0);
                    vec3 paper = texture(_WallTex, vec2(u, p.y) / 1.25).rgb; // one repeat every 1.25 m
                    float pattern = (paper.r + paper.g + paper.b) / 3.0 / 0.54; // ~1.0 on average; squared so the bright light doesn't wash it out
                    albedo = vec3(0.86, 0.80, 0.36) * pattern * pattern * (0.92 + 0.1 * mottle);
                    // Wear: darker seams every roll width (53.0 cm) and brown water stains rising from the floor.
                    float sx = fract(u / 0.53);
                    albedo *= 0.9 + 0.1 * smoothstep(0.0, 0.02, sx) * smoothstep(1.0, 0.98, sx);
                    float wet = smoothstep(0.6, 0.8, vnoise(vec2(u * 0.8, p.y * 0.6) + 31.0)) * (1.0 - smoothstep(0.3, 2.0, p.y));
                    albedo *= 1.0 - wet * vec3(0.25, 0.28, 0.45);
                    ao *= mix(0.75, 1.0, smoothstep(0.0, 1.5, p.y));
                    if (p.y < 0.1) albedo *= 0.8;
                }

                vec3 lightCol = mix(vec3(1.0, 0.75, 0.45), vec3(1.0, 0.94, 0.70), power); // low power runs warm
                vec3 col = albedo * lightCol * (0.45 * amb + direct * 1.6) * ao + lightCol * emissive * on;
                // Red spill from the EXIT sign: emergency power, so it shows best in the dark.
                vec3 toSign = _ExitPos.xyz - wpos; float dSign = length(toSign);
                col += albedo * vec3(1.0, 0.1, 0.06) * (clamp(dot(n, toSign / dSign), 0., 1.) * 0.7 + 0.3) * 0.3 / (1.0 + dSign * dSign * 0.8) * ao;
                col *= 1.0 + _NV * 9.0; // NightShot gain: fine in the dark, but lit rooms blow out to white, so you have to switch back
                // Night vision: an infrared lamp on the camera.
                vec3 toCam = _WorldSpaceCameraPos - wpos; float dCam = length(toCam);

                    float wet = smoothstep(0.6, 0.8, vnoise(vec2(u * 0.8, p.y * 0.6) + 31.0)) * (1.0 - smoothstep(0.3, 2.0, p.y));

                col = 1.0 - exp(-col * 1.25); // darker exposure

function resize() {

let last = performance.now(), t0 = last, fading = false;
const fade = document.getElementById('fade'), clock = document.getElementById('clock');

function stamp() { // real time and date, year pinned to 1996 for the found-footage feel

  document.getElementById('date').textContent = MONTHS[d.getMonth()] + ' ' + String(d.getDate()).padStart(2, '0') + ' 1996';

}
stamp();
const showDebug = () => document.getElementById('debug').hidden = document.getElementById('debugbr').hidden = !DEBUG;
showDebug();
{ // hidden debug switch on the start screen
  const el = document.getElementById('dbghold'); let timer;

    }
