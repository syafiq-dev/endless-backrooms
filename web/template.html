.hud .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }

    else if (!fading && near) { fading = true; fade.classList.add('on'); setTimeout(() => { newRun(); fade.classList.remove('on'); fading = false; }, 550); }
    atDoor = near;
    const fakeNear = fakeDoors.some(f => (f[0] - me.x) ** 2 + (f[2] - me.z) ** 2 < 1.2 * 1.2); // dead-end doors never open
    if (fakeNear && !atFake) popup('LOCKED');
    atFake = fakeNear;
    // key container: walk up to it and search it (E, or tap the button)
    const kd = keySpot && !hasKey ? Math.hypot(keySpot[0] - me.x, keySpot[1] - me.z) : 1e9;
    document.getElementById('act').hidden = !(kd < 1.7);
    stamp(); entityStep(dt); droneStep();
  } else me.yaw += dt * 0.08; // slow pan behind the start screen
  // Handheld camcorder (same as PlayerController.cs): a slow drifting wobble and tilt all the time, plus a step rhythm while walking.
  const tt = (now - t0) / 1000, amp = SWAY * (1 + me.walk * 1.5), w = me.walk * SWAY;
  const drift = (a, b, c) => Math.sin(tt * a) * .5 + Math.sin(tt * b + 1.7) * .3 + Math.sin(tt * c + 4.1) * .2, deg = Math.PI / 180;
  const side = Math.sin(me.bob * .5) * .025 * w;
  // Suspended look: the camera chases the aim instead of snapping to it, like turning a camcorder by hand.
  const ld = Math.min(dt, 0.05);
  me.sy += (LOOK_SPRING * (me.yaw - me.vy) - LOOK_DAMP * me.sy) * ld; me.vy += me.sy * ld;
  me.sp += (LOOK_SPRING * (me.pitch - me.vp) - LOOK_DAMP * me.sp) * ld; me.vp += me.sp * ld;
  const cam = [me.x + Math.cos(me.yaw) * side, 1.5 + Math.sin(me.bob) * 0.03 * w, me.z - Math.sin(me.yaw) * side];
  const camYaw = me.vy + drift(.37, .83, 1.9) * .45 * amp * deg, camPitch = me.vp + drift(.29, .71, 1.53) * .35 * amp * deg;
  ent.shake = Math.max(0, (ent.shake || 0) - dt * 1.5); const jolt = ent.shake * ent.shake * Math.sin(tt * 47) * 0.02;
  const camRoll = jolt + (drift(.23, .61, 1.31) * .7 * amp + Math.sin(me.bob * .5) * .6 * w) * deg - Math.max(-0.06, Math.min(0.06, me.sy * 0.015)); // leans into fast turns
  g.useProgram(prog); g.bindFramebuffer(g.FRAMEBUFFER, tape.fb); g.viewport(0, 0, tape.w, tape.h); g.enable(g.DEPTH_TEST); g.enable(g.CULL_FACE);
  g.uniformMatrix4fv(U('VP'), false, viewProj(cam, camYaw, camPitch, canvas.width / canvas.height, camRoll));
  g.uniform3f(U('_Cam'), ...cam); g.uniform1f(U('_T'), (now - t0) / 1000); g.uniform1f(U('_NV'), nv ? 1 : 0);
  g.clear(g.COLOR_BUFFER_BIT | g.DEPTH_BUFFER_BIT);
  g.bindVertexArray(level.vao); g.drawElements(g.TRIANGLES, level.n, g.UNSIGNED_INT, 0);
  drawEntity();
  // VHS pass to the screen
  g.bindFramebuffer(g.FRAMEBUFFER, null); g.viewport(0, 0, canvas.width, canvas.height); g.disable(g.DEPTH_TEST); g.disable(g.CULL_FACE);
  g.useProgram(vhsProg); g.bindVertexArray(null);
  g.activeTexture(g.TEXTURE2); g.bindTexture(g.TEXTURE_2D, tape.tex);
  g.uniform1i(VU('_MainTex'), 2); g.uniform2f(VU('_SrcSize'), tape.w, tape.h); g.uniform1f(VU('_T'), (now - t0) / 1000); g.uniform1f(VU('_NV'), nv ? 1 : 0);
  g.drawArrays(g.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
if (g) { newRun(); requestAnimationFrame(frame); }
</script>
